<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <title>Purple</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0a0710;
        color: #fafafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .wrap {
        display: flex;
        min-height: 100dvh;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .title {
        font-size: 1.25rem;
        font-weight: 600;
      }
      .sub {
        margin-top: 8px;
        font-size: 0.875rem;
        opacity: 0.72;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div>
        <div class="title">Purple</div>
        <div class="sub">Loading your health journal…</div>
      </div>
    </div>
  </body>
</html>
