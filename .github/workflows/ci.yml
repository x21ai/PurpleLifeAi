# Required repository secrets:
#   VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY, VITE_SUPABASE_PROJECT_ID
# (publishable/anon values only; never the service role key)
name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
  VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check:em-dash
      - run: bun run check:live-data
      - run: bun run check:unique-images
      # Repo-wide `bun run lint` carries pre-existing prettier debt and stays
      # out of CI until a one-shot format lands. Type safety is enforced here.
      - run: bunx tsc --noEmit
      - run: bun run build
      - run: bun run check:entry-budget

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium webkit
      - run: bunx playwright test tests/e2e/routes-smoke.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  responsive:
    # Data-driven responsive gate: every public route must have no horizontal
    # overflow at mobile and tablet widths. App routes and Core Web Vitals
    # budgets need a signed-in session and a production build, so they run
    # against the deployed site via `bun run test:responsive:prod` /
    # `bun run test:vitals:prod` rather than in this no-credential CI job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test tests/e2e/responsive-sweep.spec.ts -g "public routes" --project=mobile-375 --project=tablet-768
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: responsive-report
          path: test-results/
          retention-days: 7
