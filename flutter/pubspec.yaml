name: purple_app
description: Purple Life multi-platform Flutter client (offline-first).
publish_to: "none"
version: 1.0.0+28

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  connectivity_plus: ^6.1.4
  google_fonts: ^6.2.1 # optional; app shell uses platform system fonts via purple_type.dart
  drift: ^2.23.1
  drift_flutter: ^0.2.4
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  go_router: ^14.8.1
  health: ^13.3.1
  http: ^1.3.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  archive: ^4.0.7
  shared_preferences: ^2.5.3
  package_info_plus: ^8.3.0
  path_provider: ^2.1.5
  sqlite3_flutter_libs: ^0.5.42
  supabase_flutter: ^2.9.0
  app_links: ^6.4.0
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  timezone: ^0.11.1
  luciq_flutter: ^19.8.0
  fl_chart: ^0.69.2
  flutter_markdown: ^0.7.5
  file_picker: ^11.0.2
  image_picker: ^1.2.3

dev_dependencies:
  build_runner: ^2.4.15
  drift_dev: ^2.23.1
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/design/tokens.json
    - design/tokens.json
